name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm test            # unit + integration tests against an in-memory MongoDB
      - run: npm audit --omit=dev

  web:
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e   # real browser against the real API + database
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: client/test-results }

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx expo export --platform android --output-dir /tmp/expo-out
        env: { EXPO_PUBLIC_API_URL: https://api.example.com/api, CI: 1 }
